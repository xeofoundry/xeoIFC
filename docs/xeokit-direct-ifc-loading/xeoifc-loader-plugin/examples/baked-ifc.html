<!doctype html>
<!--
    Direct IFC loading of a baked IFC.

    Booleans and opening cuts are the expensive part of IFC geometry, and the engine in the browser is single threaded.
    The xeoIFC converter runs them once, natively, and writes the results back into the IFC as plain triangle meshes:

        xeoifc bake Duplex.ifc Duplex.baked.ifczip

    The baked file is still an IFC with all its metadata; elements without CSG keep their parametric geometry. It loads
    with the same load() call as any IFC, only faster. This page loads the original and the baked file and shows the engine times.

    Serve the package folder (src/ and wasm/ next to each other) and adjust the two sample URLs below.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>xeoIFC baked IFC</title>
    <style>
        html, body {height: 100%; margin: 0; font: 13px sans-serif;}
        #myCanvas {width: 100%; height: 100%;}
        #status {position: absolute; left: 10px; top: 10px; background: rgba(255, 255, 255, .9); padding: 8px; white-space: pre;}
    </style>
    <script type="importmap">
        {"imports": {"@xeokit/xeokit-sdk": "https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk@2.6.114/dist/xeokit-sdk.min.es.js"}}
    </script>
</head>
<body>
<canvas id="myCanvas"></canvas>
<div id="status"></div>
<script type="module">
    import {Viewer} from "@xeokit/xeokit-sdk";
    import {XeoIFCLoaderPlugin} from "../src/index.js";

    const viewer = new Viewer({canvasId: "myCanvas", transparent: true});
    viewer.camera.eye = [-20, 15, 25];
    viewer.camera.look = [4, 3, -9];
    const xeoIFCLoader = new XeoIFCLoaderPlugin(viewer);
    const status = document.getElementById("status");

    // Seconds of engine work in the worker: from the "parse" phase to the "edges" phase that follows the geometry
    const load = (id, src, visible) => new Promise((resolve, reject) => {
        let started = 0, seconds = 0;
        const sceneModel = xeoIFCLoader.load({
            id, src, edges: true, visible, excludeTypes: ["IfcSpace"],
            onProgress: (phase) => {
                if (phase === "parse") {
                    started ||= performance.now();
                } else if (phase === "edges") {
                    seconds = (performance.now() - started) / 1000;
                }
            }
        });
        sceneModel.on("loaded", () => resolve({sceneModel, seconds}));
        sceneModel.on("error", reject);
    });

    const original = await load("original", new URL("../../../Duplex.ifc", import.meta.url).href, false);
    status.textContent = `Duplex.ifc            engine ${original.seconds.toFixed(2)} s\n`;
    original.sceneModel.destroy();

    const baked = await load("baked", new URL("../../samples/Duplex.baked.ifczip", import.meta.url).href, true);
    status.textContent += `Duplex.baked.ifczip   engine ${baked.seconds.toFixed(2)} s`;
    viewer.cameraFlight.jumpTo(baked.sceneModel);

    window.viewer = viewer;
</script>
</body>
</html>
