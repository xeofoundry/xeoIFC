<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img"
     aria-label="Viewer load sequence: stream chunks into a StepFile, adopt it with open_file, tessellate with prune, transfer the pack to the renderer; later queries and exports go through ops on the pruned store."
     font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#182029"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="250" fill="#F6F7F4"/>
  <g font-size="12">
    <rect x="20" y="30" width="200" height="80" rx="6" fill="#EDF1EC" stroke="#C9CFD3"/>
    <text x="32" y="52" font-weight="600" fill="#182029">1  Stream the file</text>
    <text x="32" y="72" font-size="11.5" fill="#66707A" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">worker_load_chunk x N</text>
    <text x="32" y="88" font-size="11.5" fill="#66707A">step-core re-encodes chunks;</text>
    <text x="32" y="102" font-size="11.5" fill="#66707A">raw text never whole in memory</text>

    <rect x="262" y="30" width="200" height="80" rx="6" fill="#EDF1EC" stroke="#C9CFD3"/>
    <text x="274" y="52" font-weight="600" fill="#182029">2  Adopt the store</text>
    <text x="274" y="72" font-size="11.5" fill="#66707A" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">open_file(StepFile)</text>
    <text x="274" y="88" font-size="11.5" fill="#66707A">no copy, no re-parse; GlobalId</text>
    <text x="274" y="102" font-size="11.5" fill="#66707A">index built on first lookup</text>

    <rect x="504" y="30" width="200" height="80" rx="6" fill="#D9EEEC" stroke="#0E7C7B"/>
    <text x="516" y="52" font-weight="600" fill="#182029">3  Tessellate and prune</text>
    <text x="516" y="72" font-size="11.5" fill="#66707A" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">tessellate({ prune: true })</text>
    <text x="516" y="88" font-size="11.5" fill="#66707A">Model on the base store;</text>
    <text x="516" y="102" font-size="11.5" fill="#66707A">scene, then prune, then pack</text>

    <rect x="746" y="30" width="200" height="80" rx="6" fill="#EDF1EC" stroke="#C9CFD3"/>
    <text x="758" y="52" font-weight="600" fill="#182029">4  Hand over the pack</text>
    <text x="758" y="72" font-size="11.5" fill="#66707A" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">worker_load_finish().packed</text>
    <text x="758" y="88" font-size="11.5" fill="#66707A">transferable buffer to main</text>
    <text x="758" y="102" font-size="11.5" fill="#66707A">thread, or xeoifc_job_take_pack</text>

    <rect x="988" y="30" width="192" height="80" rx="6" fill="#EDF1EC" stroke="#C9CFD3"/>
    <text x="1000" y="52" font-weight="600" fill="#182029">5  Render</text>
    <text x="1000" y="72" font-size="11.5" fill="#66707A" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">Viewer.set_packed_scene</text>
    <text x="1000" y="88" font-size="11.5" fill="#66707A">viewer-render draws, picks,</text>
    <text x="1000" y="102" font-size="11.5" fill="#66707A">snaps; ids map to #n refs</text>
  </g>
  <g stroke="#182029" stroke-width="1.5" fill="none" marker-end="url(#arrow2)">
    <line x1="220" y1="70" x2="260" y2="70"/>
    <line x1="462" y1="70" x2="502" y2="70"/>
    <line x1="704" y1="70" x2="744" y2="70"/>
    <line x1="946" y1="70" x2="986" y2="70"/>
  </g>
  <g stroke="#182029" stroke-width="1.5" fill="none" marker-end="url(#arrow2)">
    <path d="M604,110 L604,150"/>
  </g>
  <rect x="262" y="152" width="684" height="72" rx="6" fill="#FFFFFF" stroke="#C9CFD3"/>
  <text x="274" y="174" font-size="12" font-weight="600" fill="#182029">After the load: the pruned store answers every non-geometry op with the original ids</text>
  <text x="274" y="194" font-size="11.5" fill="#66707A" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">spatial.tree  pset.list  query.select("is IfcWall and within(#210)")  entity.get  exportSubset</text>
  <text x="274" y="212" font-size="11.5" fill="#66707A">Editing needs retain "full": reopen, edit in transactions, save; edited documents tessellate a snapshot.</text>
</svg>
